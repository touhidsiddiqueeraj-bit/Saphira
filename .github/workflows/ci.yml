name: CI

# Build + typecheck both halves of the app on every push and PR:
#   - renderer  (src/  → tsc + vite build → dist-desktop)
#   - electron  (desktop/ → tsc → build/)
# `--ignore-scripts` skips Electron's binary download — nothing here runs it.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck + build renderer (src/ → dist-desktop)
        run: npm run build

      - name: Typecheck + build electron main (desktop/ → build/)
        run: npm run desktop:main

      - name: Upload renderer bundle
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist-desktop
          path: dist-desktop/
          retention-days: 7
