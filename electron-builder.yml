appId: app.saphira.desktop
productName: Saphira
directories:
  output: release
  buildResources: build-resources
files:
  - dist-desktop/**
  - build/**
asarUnpack:
  - "node_modules/onnxruntime-node/**"
  - "node_modules/onnxruntime-common/**"
  - "node_modules/@huggingface/transformers/**"
  - "node_modules/sharp/**"
  - "node_modules/@img/**"
# native modules ship prebuilt binaries (onnxruntime-node, sharp) — no rebuild
npmRebuild: false
linux:
  target:
    - AppImage
    - deb
  category: Utility
  synopsis: Saphira — anime companion with fully-local AI
  syncDesktopName: true
  artifactName: Saphira-${version}-linux-${arch}.${ext}
win:
  target:
    - nsis
  artifactName: Saphira-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.entertainment
  artifactName: Saphira-${version}-mac-${arch}.${ext}
